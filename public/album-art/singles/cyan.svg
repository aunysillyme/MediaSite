<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1a1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- background -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- ambient cyan glow behind heart -->
  <circle cx="320" cy="310" r="180" fill="#22D3EE" opacity="0.12" filter="url(#glow)"/>

  <!-- faceted crystalline heart (low-poly) -->
  <g transform="translate(320 320)">
    <!-- left lobe -->
    <polygon points="-110,-30 -60,-110 0,-70 -40,10" fill="url(#crystal)" opacity="0.92"/>
    <polygon points="-110,-30 -40,10 -60,60 -120,30" fill="#0E7490" opacity="0.78"/>
    <!-- right lobe -->
    <polygon points="110,-30 60,-110 0,-70 40,10" fill="url(#crystal)" opacity="0.92"/>
    <polygon points="110,-30 40,10 60,60 120,30" fill="#0E7490" opacity="0.78"/>
    <!-- bottom point -->
    <polygon points="-40,10 40,10 0,110" fill="url(#crystal)" opacity="0.95"/>
    <polygon points="-120,30 -60,60 0,110 -40,80" fill="#155E75" opacity="0.7"/>
    <polygon points="120,30 60,60 0,110 40,80" fill="#155E75" opacity="0.7"/>
    <!-- center facet -->
    <polygon points="0,-70 -40,10 0,40 40,10" fill="#67E8F9" opacity="0.85"/>

    <!-- gold kintsugi crack -->
    <path d="M -50,-80 L -10,-20 L 20,-50 L 50,30 L -20,90"
          stroke="#F5C518" stroke-width="1.8" fill="none" opacity="0.85"/>
    <path d="M -30,-40 L 10,0" stroke="#F5C518" stroke-width="1.2" fill="none" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="320" y="500" text-anchor="middle"
        font-family="Space Mono, monospace" font-size="52" font-weight="700"
        fill="#22D3EE" letter-spacing="14" opacity="0.95">CYAN</text>

  <!-- subtitle line -->
  <line x1="240" y1="520" x2="400" y2="520" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>

  <!-- signature -->
  <text x="320" y="558" text-anchor="middle"
        font-family="Patrick Hand, cursive" font-size="20"
        fill="rgba(255,255,255,0.55)">—Auny</text>
</svg>
