<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1d3a"/>
      <stop offset="60%" stop-color="#0a0c1f"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B82C9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3D4480" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Curved monitor frame, off-center to feel watched-by -->
  <g transform="translate(320 340)">
    <path d="M -210 -120 Q 0 -140 210 -120 L 210 120 Q 0 140 -210 120 Z"
          fill="url(#screen)" stroke="#7B82C9" stroke-width="1.5" opacity="0.9"/>
    <path d="M -210 -120 Q 0 -140 210 -120 L 210 120 Q 0 140 -210 120 Z"
          fill="none" stroke="#7B82C9" stroke-width="1" opacity="0.4" filter="url(#glow)"/>

    <!-- scanlines -->
    <g opacity="0.18">
      <line x1="-200" y1="-90"  x2="200" y2="-90"  stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="-60"  x2="200" y2="-60"  stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="-30"  x2="200" y2="-30"  stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="0"    x2="200" y2="0"    stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="30"   x2="200" y2="30"   stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="60"   x2="200" y2="60"   stroke="#fff" stroke-width="0.4"/>
      <line x1="-200" y1="90"   x2="200" y2="90"   stroke="#fff" stroke-width="0.4"/>
    </g>

    <!-- iris / eye at center -->
    <circle r="38" fill="#0a0c1f" stroke="#7B82C9" stroke-width="1"/>
    <circle r="20" fill="#7B82C9" opacity="0.45"/>
    <circle r="6"  fill="#fff" opacity="0.95"/>
  </g>

  <text x="50%" y="555" text-anchor="middle"
        font-family="'Outfit', system-ui, sans-serif" font-weight="700"
        font-size="44" fill="#fff" letter-spacing="2">MECHANICAL SCREEN</text>
  <text x="50%" y="588" text-anchor="middle"
        font-family="'Patrick Hand', cursive, system-ui" font-size="20"
        fill="#7B82C9" opacity="0.85">—Auny</text>
</svg>
