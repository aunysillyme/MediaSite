    z-index: 0;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(

      transparent 0px, transparent 3px,

    pointer-events: none;
    z-index: 9999;
    opacity: 0.22;
  }

  .page {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 0 16px;
    gap: 4px;
    position: relative;
    overflow: visible;
  }

  .bg-art {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-blob {
    position: absolute;
    border-radius: 50%;
  }

  .bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero {
    text-align: center;
    position: relative;
    z-index: 4;
    margin-bottom: 8px;
    animation: fadeup 0.6s ease-out both;
  }

  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 5px;
    color: #00E5FF;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 14px;
    animation: pulse-role 3s ease-in-out infinite;
  }

  .hero-lines {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .hero-line {
    font-family: 'Space Mono', monospace;
    font-size: clamp(22px, 4.5vw, 40px);
    font-weight: 700;
    color: #f0ece4;
    line-height: 1.25;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hero-line .dot {
    color: #FF6B1A;
    font-size: 0.6em;
    line-height: 1;
  }

  .hero-accent {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 54px);
    color: #FF6B1A;
    line-height: 1.1;
    margin-top: 6px;
    letter-spacing: 0;
  }

  @keyframes pulse-role {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.85; }
  }

  @keyframes fadeup {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .orbit-system {
    position: relative;
    z-index: 4;
    animation: fadeup 0.6s 0.2s ease-out both;
  }

  .planet {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    z-index: 6;
  }

  .planet-icon {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    flex-shrink: 0;
    background: #030308;
  }

  .planet:hover .planet-icon {
    transform: scale(1.22);
  }

  .planet-name {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    margin-top: 6px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.18s ease;
    pointer-events: none;
    padding: 2px 8px;
    border-radius: 3px;
    background: rgba(3, 3, 8, 0.96);
  }

  .planet:hover .planet-name {
    opacity: 1;
  }

  .vinyl-wrap {
    position: absolute;
    z-index: 4;
    animation: vspin 14s linear infinite;
  }

  @keyframes vspin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .ring-track {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid transparent;
    pointer-events: none;
  }

  .ring-inner { animation: ring-c 4s ease-in-out infinite; }
  .ring-outer { animation: ring-o 4s ease-in-out 1.5s infinite; }

  @keyframes ring-c {
    0%, 100% { border-color: rgba(0, 229, 255, 0.18); }
    50%       { border-color: rgba(0, 229, 255, 0.5);  }
  }

  @keyframes ring-o {
    0%, 100% { border-color: rgba(255, 107, 26, 0.15); }
    50%       { border-color: rgba(255, 107, 26, 0.46); }
  }

  .footer {
    font-size: 18px;
    color: rgba(255, 107, 26, 0.45);
    position: relative;
    z-index: 4;
    margin-top: 10px;
    animation: fadeup 0.6s 0.4s ease-out both;

  .venue-btn {
    position: fixed;
    top: 1.25rem;
    right: 1.5rem;
    z-index: 200;
    padding: 0.45rem 1rem;

  }

    border-color: #FF6B00;
    box-shadow: 0 0 14px rgba(255, 107, 0, 0.27);
  }

  }

      svg: '<svg viewBox="0 0 24 24" width="24" height="24" fill="#00C7F2"><path d="M18.81 4.16c0 .697-.566 1.26-1.26 1.26-.697 0-1.26-.563-1.26-1.26 0-.695.563-1.258 1.26-1.258.694 0 1.26.563 1.26 1.258zM7.44 18.84H4.8v-1.68h2.64v1.68zm3.6 0H8.4v-1.68h2.64v1.68zm3.6 0H12v-1.68h2.64v1.68zm3.6 0h-2.64v-1.68h2.64v1.68zm0-2.88h-2.64v-1.68h2.64v1.68zm0-2.88h-2.64v-1.68h2.64v1.68zm0-2.88h-2.64V8.52h2.64v1.68z"/></svg>'
    },
    {

      url: 'https://music.amazon.com/artists/B0GDL275G8/auny',
      c: '#26CAFF',
      svg: '<svg viewBox="0 0 24 24" width="24" height="24" fill="#26CAFF"><path d="M13.958 10.09c0 1.232.029 2.256-.591 3.351-.502.891-1.301 1.439-2.186 1.439-1.214 0-1.922-.924-1.922-2.292 0-2.692 2.415-3.182 4.699-3.182v.684zm3.186 7.706a.661.661 0 01-.75.074c-1.052-.873-1.238-1.276-1.814-2.106-1.734 1.768-2.962 2.297-5.209 2.297-2.659 0-4.731-1.641-4.731-4.925 0-2.565 1.391-4.309 3.37-5.164 1.715-.754 4.11-.891 5.942-1.097v-.41c0-.753.06-1.642-.384-2.294-.385-.578-1.124-.816-1.775-.816-1.205 0-2.277.618-2.54 1.897-.054.285-.262.567-.549.582l-3.061-.331c-.258-.058-.548-.266-.472-.66C5.97 1.782 8.953.5 11.613.5c1.36 0 3.138.362 4.21 1.394 1.36 1.265 1.231 2.955 1.231 4.793v4.341c0 1.304.541 1.876 1.05 2.578.178.25.216.547-.011.733-.569.474-1.583 1.354-2.14 1.847l-.009-.009zm3.043 3.801C18.237 22.706 15.2 24 12.539 24 8.749 24 5.311 22.609 2.7 20.26c-.219-.196-.023-.464.24-.313 2.848 1.661 6.369 2.657 10.005 2.657 2.449 0 5.143-.508 7.623-1.559.374-.163.686.246.619.552zM21.856 20.57c-.296-.383-1.96-.181-2.709-.091-.228.028-.263-.171-.058-.315 1.328-.934 3.509-.665 3.764-.352.255.315-.066 2.49-1.312 3.529-.191.16-.374.075-.289-.136.28-.7.909-2.268.604-2.635z"/></svg>'

    {

    {

  // Build orbit container
  var orbit = document.getElementById('orbit');
  orbit.style.width    = W + 'px';
  orbit.style.height   = W + 'px';
  orbit.style.position = 'relative';

  function makeRing(r, cls) {
    var d = document.createElement('div');
    d.className = 'ring-track ' + cls;
    d.style.width  = (r * 2) + 'px';
    d.style.height = (r * 2) + 'px';
    d.style.left   = (CX - r) + 'px';
    d.style.top    = (CY - r) + 'px';
    orbit.appendChild(d);
  }
  makeRing(IR, 'ring-inner');
  makeRing(OR, 'ring-outer');

  // Vinyl (spinning grooves)
  var vsz = 100;
  var vWrap = document.createElement('div');
  vWrap.className = 'vinyl-wrap';
  vWrap.style.cssText = 'width:' + vsz + 'px;height:' + vsz + 'px;margin-left:' + (-(vsz/2)) + 'px;margin-top:' + (-(vsz/2)) + 'px;top:50%;left:50%;';
  vWrap.innerHTML = '<svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="49" fill="#0a0a10"/><circle cx="50" cy="50" r="46" fill="none" stroke="#161620" stroke-width="1.5"/><circle cx="50" cy="50" r="42" fill="none" stroke="#111118" stroke-width="1"/><circle cx="50" cy="50" r="38" fill="none" stroke="#161620" stroke-width="1.5"/><circle cx="50" cy="50" r="34" fill="none" stroke="#111118" stroke-width="1"/><circle cx="50" cy="50" r="30" fill="none" stroke="#161620" stroke-width="1"/><circle cx="50" cy="50" r="25" fill="none" stroke="#FF6B1A" stroke-width="0.8" opacity="0.32"/><circle cx="50" cy="50" r="21" fill="#0a0a10"/><circle cx="50" cy="50" r="18" fill="none" stroke="#FF6B1A" stroke-width="1.5" opacity="0.7"/></svg>';
  orbit.appendChild(vWrap);

  // PFP — sits below vinyl (z-index 8), shows through transparent vinyl center
  var pfpSize = 34;
  var pfpWrap = document.createElement('div');
  pfpWrap.style.position        = 'absolute';
  pfpWrap.style.top             = '50%';
  pfpWrap.style.left            = '50%';
  pfpWrap.style.width           = pfpSize + 'px';
  pfpWrap.style.height          = pfpSize + 'px';
  pfpWrap.style.marginLeft      = -(pfpSize / 2) + 'px';
  pfpWrap.style.marginTop       = -(pfpSize / 2) + 'px';
  pfpWrap.style.borderRadius    = '50%';
  pfpWrap.style.overflow        = 'hidden';
  pfpWrap.style.zIndex          = '8';
  pfpWrap.style.backgroundColor = '#1a0a00';
  pfpWrap.style.backgroundSize  = 'cover';
  pfpWrap.style.backgroundPosition = 'center top';
  orbit.appendChild(pfpWrap);

  var pfpPaths = ['/images/auny-pfp-5.png'];
  (function tryPfp(i) {
    if (i >= pfpPaths.length) return;
    var t = new Image();
    t.onload = function () {
      pfpWrap.style.backgroundImage = 'url(' + pfpPaths[i] + ')';
    };
    t.onerror = function () { tryPfp(i + 1); };
    t.src = pfpPaths[i];
  })(0);

  // Planet factory
  function makePlanet(p) {
    var a = document.createElement('a');
    a.href   = p.url;
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    a.className = 'planet';
    a.setAttribute('aria-label', p.n);
    a.innerHTML =
      '<div class="planet-icon" style="width:' + ICON + 'px;height:' + ICON + 'px;border:1.5px solid ' + p.c + ';box-shadow:0 0 14px ' + p.c + '60,inset 0 0 22px ' + p.c + '35;">' + p.svg + '</div>' +
      '<span class="planet-name" style="color:' + p.c + ';">' + p.n + '</span>';
    orbit.appendChild(a);
    return a;
  }

  var innerEls = SOCIALS.map(makePlanet);
  var outerEls = STREAMING.map(makePlanet);

  // Animation loop
  var innerAngle = 0;
  var outerAngle = Math.PI / 8;
  var last = null;

  function tick(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;

    innerAngle -= dt * (2 * Math.PI / 38);
    outerAngle += dt * (2 * Math.PI / 54);

    innerEls.forEach(function (el, i) {
      var a = innerAngle + (i / innerEls.length) * 2 * Math.PI;
      el.style.left = (CX + IR * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + IR * Math.sin(a) - HALF) + 'px';
    });

    outerEls.forEach(function (el, i) {
      var a = outerAngle + (i / outerEls.length) * 2 * Math.PI;
      el.style.left = (CX + OR * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + OR * Math.sin(a) - HALF) + 'px';
    });

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

})();
</script>
