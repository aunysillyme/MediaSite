    font-family: 'Space Mono', monospace;
    font-size: 7px;

    position: absolute;
    z-index: 4;

    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }

    position: absolute;
    border-radius: 50%;
    border: 1.5px solid transparent;
    pointer-events: none;
  }

  .ring-2 { animation: ring-2a 4s ease-in-out 1s infinite; }
  .ring-3 { animation: ring-3a 4s ease-in-out 2s infinite; }

    0%, 100% { border-color: rgba(0, 191, 255, 0.15); }
    50%       { border-color: rgba(0, 191, 255, 0.42); }

  @keyframes ring-2a {
    0%, 100% { border-color: rgba(30, 144, 255, 0.13); }
    50%       { border-color: rgba(30, 144, 255, 0.38); }

  }
</style>

    + '<circle cx="55" cy="55" r="3" fill="#1E90FF" opacity="0.8"/>'
    + '</svg>';
  orbit.appendChild(vWrap);

  // ── Album cover (non-spinning, clickable, sits over vinyl center) ──
  var lblSize = 64;
  var lblWrap = document.createElement('a');
  lblWrap.href = ALBUM_URL;
  lblWrap.target = '_blank';
  lblWrap.rel = 'noopener';
  lblWrap.setAttribute('aria-label', 'Blue Lightning — open full album on Spotify');
  lblWrap.style.cssText = 'position:absolute;top:50%;left:50%;width:' + lblSize + 'px;height:' + lblSize + 'px;margin-left:' + (-(lblSize/2)) + 'px;margin-top:' + (-(lblSize/2)) + 'px;border-radius:50%;background:#050510;z-index:8;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 24px rgba(30,144,255,0.45),inset 0 0 8px rgba(0,0,0,0.6);cursor:pointer;';
  lblWrap.innerHTML = '<img src="' + ALBUM_ART + '" alt="Blue Lightning album cover" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;"/>';
  orbit.appendChild(lblWrap);

  // ── Planet factory ──
  function makePlanet(p) {
    var a = document.createElement('a');
    a.href   = p.u;
    a.target = '_blank';
    a.rel    = 'noopener';
    a.className = 'planet';
    a.setAttribute('aria-label', p.n + ' — open track on Spotify');

    var numStr = (p.num < 10 ? '0' : '') + p.num;
    var iconSvg = '<svg viewBox="0 0 28 28" width="28" height="28">'
      + '<text x="14" y="19" text-anchor="middle" font-family="Space Mono,monospace" font-size="11" font-weight="700" fill="' + p.c + '" opacity="0.9">' + numStr + '</text>'
      + '</svg>';

    a.innerHTML =
      '<div class="planet-icon" style="width:' + ICON + 'px;height:' + ICON + 'px;border:1.5px solid ' + p.c + ';box-shadow:0 0 12px ' + p.c + '55,inset 0 0 18px ' + p.c + '28;">' + iconSvg + '</div>'
      + '<span class="planet-name" style="color:' + p.c + ';">' + p.n + '</span>'
      + '<span class="track-dur">' + p.dur + '</span>';

    orbit.appendChild(a);
    return a;
  }

  var ring1Els = RING1.map(makePlanet);
  var ring2Els = RING2.map(makePlanet);
  var ring3Els = RING3.map(makePlanet);

  // ── Animation ──
  var a1 = 0;
  var a2 = Math.PI / 9;
  var a3 = Math.PI / 5;
  var last = null;

  function tick(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;

    a1 -= dt * (2 * Math.PI / 42);   // inner: counter-clockwise slow
    a2 += dt * (2 * Math.PI / 58);   // middle: clockwise medium
    a3 -= dt * (2 * Math.PI / 50);   // outer: counter-clockwise medium

    ring1Els.forEach(function (el, i) {
      var a = a1 + (i / ring1Els.length) * 2 * Math.PI;
      el.style.left = (CX + R1 * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + R1 * Math.sin(a) - HALF) + 'px';
    });

    ring2Els.forEach(function (el, i) {
      var a = a2 + (i / ring2Els.length) * 2 * Math.PI;
      el.style.left = (CX + R2 * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + R2 * Math.sin(a) - HALF) + 'px';
    });

    ring3Els.forEach(function (el, i) {
      var a = a3 + (i / ring3Els.length) * 2 * Math.PI;
      el.style.left = (CX + R3 * Math.cos(a) - HALF) + 'px';
      el.style.top  = (CY + R3 * Math.sin(a) - HALF) + 'px';
    });

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
