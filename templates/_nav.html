<div id="cursor-spotlight" aria-hidden="true"></div>

  <div class="nav-links">

<script>
(function () {
  var canvas = document.getElementById('atmosphere-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var coarse = matchMedia('(pointer:coarse)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var NOTES = ['♪','♫','♩','♬','♭','♮'];

  function readAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#1E90FF';
  }
  function readAccentRgb() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();
    return v || '30,144,255';
  }
  var accent = readAccent();
  var accentRgb = readAccentRgb();

  var W = 0, H = 0;
  function resize() {
    W = canvas.width  = Math.floor(innerWidth  * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize, { passive: true });

  // ─── Ambient dust particles ──────────────────────────────────
  var COUNT = reduce ? 22 : 60;
  var particles = [];
  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
      size: (12 + Math.random() * 8.5) * dpr,
      vx: (Math.random() - 0.5) * 0.4 * dpr,
      vy: (Math.random() - 0.5) * 0.4 * dpr,
      opacity: 0.13 + Math.random() * 0.17,
      rotation: (Math.random() - 0.5) * 0.6,
      // displacement offset from natural drift — decays back to 0 (spring-back)
      ox: 0, oy: 0,
    });
  }

  var mouseX = -9999, mouseY = -9999;
  var lastSpawnX = 0, lastSpawnY = 0;
  var spotlight = document.getElementById('cursor-spotlight');

  // ─── Cursor trail (musical notes that fade behind cursor) ────
  var trail = [];
  function spawnTrail(x, y) {
    if (reduce || coarse) return;
    trail.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 0.6 * dpr,
      vy: 0.2 * dpr + Math.random() * 0.4 * dpr,
      spawnedAt: performance.now(),
      maxLife: 1300 + Math.random() * 600,
      glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
      size: (10 + Math.random() * 4) * dpr,
      rot: (Math.random() - 0.5) * 0.5,
    });
  }

  if (!reduce && !coarse) {
    addEventListener('mousemove', function (e) {
      mouseX = e.clientX * dpr;
      mouseY = e.clientY * dpr;
      // Spotlight follows cursor (transform on the div)
      if (spotlight) {
        spotlight.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
        spotlight.style.opacity = '1';
      }
      // Rate-limit trail spawns by distance moved (every ~70 css px)
      var dxs = e.clientX - lastSpawnX, dys = e.clientY - lastSpawnY;
      if (dxs * dxs + dys * dys > 70 * 70) {
        spawnTrail(mouseX, mouseY);
        lastSpawnX = e.clientX;
        lastSpawnY = e.clientY;
      }
    }, { passive: true });
    addEventListener('mouseleave', function () {
      mouseX = mouseY = -9999;
      if (spotlight) spotlight.style.opacity = '0';
    }, { passive: true });
  }

  var REPULSE_RADIUS = 300 * dpr;
  var REPULSE_STRENGTH = reduce ? 0 : 3.2;

  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(loop);
  });

  var accentTick = 0;
  function loop() {
    if (!running) return;
    if ((accentTick++ & 31) === 0) {
      accent = readAccent();
      accentRgb = readAccentRgb();
      if (spotlight) {
        spotlight.style.background =
          'radial-gradient(circle, rgba(' + accentRgb + ',0.14) 0%, rgba(' + accentRgb + ',0.06) 28%, transparent 65%)';
      }
    }
    ctx.clearRect(0, 0, W, H);

    // ambient dust
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      // Natural drift along the home path
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -24) p.x = W + 24;
      if (p.x > W + 24) p.x = -24;
      if (p.y < -24) p.y = H + 24;
      if (p.y > H + 24) p.y = -24;
      // Composite position = home path + cursor displacement
      var fx = p.x + p.ox, fy = p.y + p.oy;
      // Cursor repulse — accumulates into displacement offset, not position
      var dx = fx - mouseX, dy = fy - mouseY;
      var dist2 = dx * dx + dy * dy;
      var r2 = REPULSE_RADIUS * REPULSE_RADIUS;
      if (dist2 < r2 && dist2 > 1) {
        var dist = Math.sqrt(dist2);
        var force = (1 - dist / REPULSE_RADIUS) * REPULSE_STRENGTH;
        p.ox += (dx / dist) * force * 15;
        p.oy += (dy / dist) * force * 15;
      }
      // Spring back: damp the displacement toward 0 every frame
      p.ox *= 0.93;
      p.oy *= 0.93;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x + p.ox, p.y + p.oy);
      ctx.rotate(p.rotation);
      ctx.fillStyle = accent;
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.glyph, 0, 0);
      ctx.restore();
    }

    // cursor trail — very low opacity, fades over lifetime
    var now = performance.now();
    for (var b = trail.length - 1; b >= 0; b--) {
      var tp = trail[b];
      var age = now - tp.spawnedAt;
      if (age > tp.maxLife) { trail.splice(b, 1); continue; }
      tp.x += tp.vx;
      tp.y += tp.vy;
      tp.vy += 0.005 * dpr;     // slight gravity drift
      tp.rot += 0.012;
      var t = age / tp.maxLife;
      // Peak opacity capped at ~0.18, then fades out
      var fadeIn  = Math.min(1, age / 220);
      var fadeOut = 1 - t;
      var alpha = 0.13 * fadeIn * fadeOut;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(tp.x, tp.y);
      ctx.rotate(tp.rot);
      ctx.fillStyle = accent;
      ctx.font = tp.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tp.glyph, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
