<canvas id="atmosphere-canvas" aria-hidden="true"></canvas>
<div id="custom-cursor" aria-hidden="true"><div class="cursor-core"></div><div class="cursor-halo"></div></div>

  </div>

<script>
(function () {
  var canvas = document.getElementById('atmosphere-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var coarse = matchMedia('(pointer:coarse)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var NOTES = ['♪','♫','♩','♬','♭','♮'];

  function readAccent() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return v || '#1E90FF';
  }
  function readAccentRgb() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();
    return v || '30,144,255';
  }
  var accent = readAccent();
  var accentRgb = readAccentRgb();

  var W = 0, H = 0;
  function resize() {
    W = canvas.width  = Math.floor(innerWidth  * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize, { passive: true });

  // ─── Dust particles ──────────────────────────────────────────
  var COUNT = reduce ? 22 : 60;
  var particles = [];
  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
      size: (12 + Math.random() * 8.5) * dpr,
      vx: (Math.random() - 0.5) * 0.4 * dpr,
      vy: (Math.random() - 0.5) * 0.4 * dpr,
      opacity: 0.19 + Math.random() * 0.24,
      rotation: (Math.random() - 0.5) * 0.6,
    });
  }

  var mouseX = -9999, mouseY = -9999;
  if (!reduce && !coarse) {
    addEventListener('mousemove', function (e) {
      mouseX = e.clientX * dpr;
      mouseY = e.clientY * dpr;
    }, { passive: true });
    addEventListener('mouseleave', function () { mouseX = mouseY = -9999; }, { passive: true });
  }

  var REPULSE_RADIUS = 230 * dpr;
  var REPULSE_STRENGTH = reduce ? 0 : 2.2;

  // ─── Click burst ─────────────────────────────────────────────
  var bursts = [];
  if (!coarse && !reduce) {
    addEventListener('click', function (e) {
      var cx = e.clientX * dpr, cy = e.clientY * dpr;
      var n = 9;
      for (var k = 0; k < n; k++) {
        var a = (k / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
        var sp = (2.6 + Math.random() * 3.2) * dpr;
        bursts.push({
          x: cx, y: cy,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          spawnedAt: performance.now(),
          maxLife: 650 + Math.random() * 250,
          glyph: NOTES[Math.floor(Math.random() * NOTES.length)],
          size: (13 + Math.random() * 7) * dpr,
          rot: (Math.random() - 0.5) * 1.2,
        });
      }
    }, { passive: true });
  }

  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(loop);
  });

  var accentTick = 0;
  function loop() {
    if (!running) return;
    if ((accentTick++ & 31) === 0) {
      accent = readAccent();
      accentRgb = readAccentRgb();
    }
    ctx.clearRect(0, 0, W, H);

    // dust
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -24) p.x = W + 24;
      if (p.x > W + 24) p.x = -24;
      if (p.y < -24) p.y = H + 24;
      if (p.y > H + 24) p.y = -24;
      var dx = p.x - mouseX, dy = p.y - mouseY;
      var dist2 = dx * dx + dy * dy;
      var r2 = REPULSE_RADIUS * REPULSE_RADIUS;
      if (dist2 < r2 && dist2 > 1) {
        var dist = Math.sqrt(dist2);
        var force = (1 - dist / REPULSE_RADIUS) * REPULSE_STRENGTH;
        p.x += (dx / dist) * force * 10;
        p.y += (dy / dist) * force * 10;
      }
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = accent;
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.glyph, 0, 0);
      ctx.restore();
    }

    // bursts
    var now = performance.now();
    for (var b = bursts.length - 1; b >= 0; b--) {
      var bp = bursts[b];
      var age = now - bp.spawnedAt;
      if (age > bp.maxLife) { bursts.splice(b, 1); continue; }
      bp.x += bp.vx;
      bp.y += bp.vy;
      bp.vx *= 0.93;
      bp.vy *= 0.93;
      bp.rot += 0.04;
      var t = age / bp.maxLife;
      var alpha = (1 - t) * 0.85;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(bp.x, bp.y);
      ctx.rotate(bp.rot);
      ctx.fillStyle = accent;
      ctx.font = bp.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(bp.glyph, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ─── Custom cursor ───────────────────────────────────────────
  var cursorEl = document.getElementById('custom-cursor');
  if (cursorEl && !coarse) {
    document.documentElement.classList.add('custom-cursor-active');
    var cxTarget = -9999, cyTarget = -9999;
    var cxNow = -9999, cyNow = -9999;
    var haloX = -9999, haloY = -9999;
    var coreEl = cursorEl.querySelector('.cursor-core');
    var haloEl = cursorEl.querySelector('.cursor-halo');

    addEventListener('mousemove', function (e) {
      cxTarget = e.clientX;
      cyTarget = e.clientY;
      if (cxNow < -1000) { cxNow = cxTarget; cyNow = cyTarget; haloX = cxTarget; haloY = cyTarget; }
    }, { passive: true });

    addEventListener('mouseleave', function () {
      cursorEl.style.opacity = '0';
    }, { passive: true });
    addEventListener('mouseenter', function () {
      cursorEl.style.opacity = '1';
    }, { passive: true });

    // hover state — when over interactive elements
    document.addEventListener('mouseover', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('a, button, [role="button"], .featured-cover-link, .mini-card, .card, .platform')) {
        cursorEl.classList.add('hover');
      } else {
        cursorEl.classList.remove('hover');
      }
    }, { passive: true });

    function cursorLoop() {
      // Core: snappy follow (small lag)
      cxNow += (cxTarget - cxNow) * 0.55;
      cyNow += (cyTarget - cyNow) * 0.55;
      // Halo: lazy follow (more lag) — comet effect
      haloX += (cxTarget - haloX) * 0.18;
      haloY += (cyTarget - haloY) * 0.18;
      coreEl.style.transform = 'translate3d(' + cxNow + 'px,' + cyNow + 'px,0)';
      haloEl.style.transform = 'translate3d(' + haloX + 'px,' + haloY + 'px,0)';
      requestAnimationFrame(cursorLoop);
    }
    requestAnimationFrame(cursorLoop);
  }
})();
</script>
