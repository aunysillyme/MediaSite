<!-- Newsletter signup — minimal one-line form. Posts to /api/subscribe → beehiiv. -->
<form class="signup" id="signup-form" novalidate>
  <span class="signup-label">✦ &nbsp; sign up for updates</span>
  <label class="signup-label-sr" for="signup-email">Your email</label>
  <input type="email" id="signup-email" name="email" required autocomplete="email" placeholder="you@somewhere.net">
  <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="signup-hp">
  <button type="submit" id="signup-submit">subscribe →</button>
  <span class="signup-status" id="signup-status" role="status" aria-live="polite"></span>
</form>
