<!-- "More recent releases" strip — rendered at the bottom of every single
     and album page. Shows the N newest releases of that same kind,
     excluding the current one. Filled by recentStripFor() in _lib.mjs.

     Variables: HEADING (label text) and CARDS (pre-rendered mini-cards).
     Do NOT write those names in brace form here — render() replaceAll's
     across the whole file, comments included, so a documented placeholder
     gets substituted and ships a duplicate card block inside this comment.
-->
<section class="recent-strip" aria-label="More recent releases">
  <p class="recent-strip-label">{{HEADING}}</p>
  <div class="recent-strip-row">
{{CARDS}}
  </div>
</section>
