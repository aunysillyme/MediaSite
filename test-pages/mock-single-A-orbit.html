<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE — Auny (Mock A: Lyric Orbit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Cormorant+Garamond:ital,wght@1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #030308; font-family: 'Space Mono', monospace; }
  body::before {
    content:''; position:fixed; inset:0;
    background: url('/images/background-site-1920x1080.png') center/cover no-repeat;
    opacity: 0.22; filter: hue-rotate(200deg) saturate(1.3); z-index: 0; pointer-events: none;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background-image: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,0.1) 3px 4px);
    pointer-events: none; z-index: 50; opacity: 0.22;
  }
  .bg-blob { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; }
  .page { width: 100%; min-height: 100vh; display: flex; flex-direction: row; align-items: stretch; position: relative; }

  .left-panel { width: 32%; min-width: 260px; display: flex; flex-direction: column; justify-content: center; padding: 52px 36px 52px 56px; position: relative; z-index: 4; }
  .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 4; }

  .mock-tag { position: fixed; top: 1.25rem; left: 1.5rem; z-index: 300; padding: 0.4rem 0.8rem; border-radius: 6px; background: rgba(30,144,255,0.15); border: 1px solid rgba(30,144,255,0.4); color: #1E90FF; font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }

  .hero-label  { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 4px; color: #00BFFF; text-transform: uppercase; opacity: 0.6; margin-bottom: 14px; }
  .hero-name   { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: clamp(48px, 6vw, 96px); color: #fff; line-height: 0.95; letter-spacing: -0.5px; margin-bottom: 6px; text-shadow: 0 0 50px rgba(30,144,255,0.45); }
  .hero-subtitle { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 4px; color: #1E90FF; text-transform: uppercase; opacity: 0.6; margin-bottom: 24px; }
  .meta-block { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; border-left: 2px solid rgba(30,144,255,0.25); padding-left: 14px; }
  .meta-key { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 3px; color: #1E90FF; text-transform: uppercase; opacity: 0.55; display: block; }
  .meta-val { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #c8c4bc; }
  .hero-accent { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 700; font-size: clamp(22px, 2.8vw, 38px); color: #1E90FF; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
  .page-footer { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.18); text-transform: uppercase; margin-top: auto; padding-top: 28px; }

  .orbit-system { position: relative; z-index: 4; }

  .lyric-bit {
    position: absolute;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    color: #c8c4bc;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 24px rgba(30,144,255,0.5);
    transform-origin: center center;
    transition: color 0.4s, text-shadow 0.4s;
  }
  .lyric-bit.bright { color: #fff; text-shadow: 0 0 28px rgba(0,191,255,0.85); }

  .ring-track { position: absolute; border-radius: 50%; border: 1px dashed rgba(30,144,255,0.18); pointer-events: none; }

  .vinyl-wrap { position: absolute; z-index: 4; animation: vspin 22s linear infinite; }
  @keyframes vspin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .cover-wrap { position: absolute; top: 50%; left: 50%; width: 220px; height: 220px; margin-left: -110px; margin-top: -110px; border-radius: 50%; overflow: hidden; z-index: 8; box-shadow: 0 0 80px rgba(30,144,255,0.5), inset 0 0 12px rgba(0,0,0,0.7); }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="mock-tag">Mock A · Lyric Orbit</div>
<div class="bg-blob" style="width:320px;height:320px;background:rgba(0,50,120,0.22);top:-80px;left:-100px;filter:blur(60px);"></div>
<div class="bg-blob" style="width:260px;height:260px;background:rgba(0,80,180,0.16);top:30%;right:-100px;filter:blur(50px);"></div>
<div class="bg-blob" style="width:240px;height:240px;background:rgba(80,0,200,0.12);bottom:10%;left:-80px;filter:blur(50px);"></div>

<div class="page">
  <div class="left-panel">
    <p class="hero-label">✦ &nbsp; single</p>
    <h1 class="hero-name">BLUE</h1>
    <p class="hero-subtitle">Auny &nbsp;·&nbsp; 2026</p>
    <div class="meta-block">
      <div><span class="meta-key">Released</span><span class="meta-val">January 24, 2026</span></div>
      <div><span class="meta-key">Series</span><span class="meta-val">Color Series · 2 of 5</span></div>
      <div><span class="meta-key">Genre</span><span class="meta-val">Dark Pop · Ambient EDM</span></div>
      <div><span class="meta-key">Label</span><span class="meta-val">11119560 Records DK</span></div>
    </div>
    <div class="hero-accent">listen now →</div>
    <p class="page-footer">BLUE &nbsp;·&nbsp; AUNY &nbsp;·&nbsp; 2026</p>
  </div>
  <div class="right-panel">
    <div class="orbit-system" id="orbit"></div>
  </div>
</div>

<script>
(function(){
  var isMobile = window.innerWidth < 640;
  var vw = isMobile ? window.innerWidth : window.innerWidth * 0.68;
  var vh = window.innerHeight;
  var S  = Math.max(360, Math.min(860, vw - 24, vh - 40));
  var R1 = Math.round(S * 0.26);
  var R2 = Math.round(S * 0.39);
  var R3 = Math.round(S * 0.50);
  var W  = (R3 + 120) * 2;
  var CX = W/2, CY = W/2;

  var orbit = document.getElementById('orbit');
  orbit.style.width = W+'px';
  orbit.style.height = W+'px';
  orbit.style.position = 'relative';

  // ring guides
  [R1, R2, R3].forEach(function(r){
    var d = document.createElement('div');
    d.className = 'ring-track';
    d.style.width = (r*2)+'px';
    d.style.height = (r*2)+'px';
    d.style.left = (CX-r)+'px';
    d.style.top  = (CY-r)+'px';
    orbit.appendChild(d);
  });

  // spinning vinyl behind cover
  var vinyl = document.createElement('div');
  vinyl.className = 'vinyl-wrap';
  vinyl.style.cssText = 'width:240px;height:240px;top:50%;left:50%;margin-left:-120px;margin-top:-120px;';
  vinyl.innerHTML = '<svg viewBox="0 0 240 240" width="240" height="240">'
    + '<circle cx="120" cy="120" r="118" fill="#050510"/>'
    + '<circle cx="120" cy="120" r="112" fill="none" stroke="#0d1428" stroke-width="2"/>'
    + '<circle cx="120" cy="120" r="104" fill="none" stroke="#0a1224" stroke-width="1"/>'
    + '<circle cx="120" cy="120" r="96"  fill="none" stroke="#0d1428" stroke-width="2"/>'
    + '<circle cx="120" cy="120" r="88"  fill="none" stroke="#0a1224" stroke-width="1"/>'
    + '<circle cx="120" cy="120" r="80"  fill="none" stroke="#1E90FF" stroke-width="0.8" opacity="0.3"/>'
    + '</svg>';
  orbit.appendChild(vinyl);

  // album cover (still)
  var cover = document.createElement('div');
  cover.className = 'cover-wrap';
  cover.innerHTML = '<img src="/album-art/blue-single.jpg" alt="BLUE single cover"/>';
  orbit.appendChild(cover);

  // lyric fragments
  var R1_LINES = ['Blue is calm', 'Blue is cold', 'Blue is endless', 'Blue is space'];
  var R2_LINES = ['the color of ice', 'the color of sky', 'the color of storms', 'the light that glows', 'when lightning strikes'];
  var R3_LINES = ['Calm on the surface', 'while the world breaks down', 'frozen in time', 'I slow my breath', 'I lose myself in', 'without fearing what’s next'];

  function placeLyrics(lines, R, size, bright) {
    lines.forEach(function(text, i){
      var a = (i / lines.length) * 2 * Math.PI - Math.PI/2;
      var el = document.createElement('div');
      el.className = 'lyric-bit' + (bright ? ' bright' : '');
      el.style.fontSize = size + 'px';
      el.textContent = text;
      orbit.appendChild(el);
      var x = CX + R * Math.cos(a);
      var y = CY + R * Math.sin(a);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      // tangent angle
      var deg = (a * 180/Math.PI) + 90;
      // keep text upright-ish: flip when on bottom half
      if (deg > 90 && deg < 270) deg -= 180;
      el.style.transform = 'translate(-50%, -50%) rotate(' + deg + 'deg)';
    });
  }

  placeLyrics(R1_LINES, R1, 17, true);
  placeLyrics(R2_LINES, R2, 15, false);
  placeLyrics(R3_LINES, R3, 14, false);
})();
</script>
</body>
</html>
